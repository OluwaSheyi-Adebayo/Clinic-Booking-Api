<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rohifield Family Clinic | Book an appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F1; --surface:#FBFCFB; --ink:#15292B; --muted:#566B6C; --line:#D0DCDA;
  --teal:#1F6F68; --teal-deep:#17383A; --mint:#CFE6E1; --alert:#A63D32; --alert-soft:#F8E6E3; --ok-soft:#DCEFE9;
  --serif:'Fraunces',Georgia,serif; --sans:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans)}
:focus-visible{outline:3px solid #E0A526;outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:100vh}
.side{background:var(--teal-deep);color:#E8F2F0;padding:40px 32px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:14px;align-items:center;font:800 32px/1.08 var(--serif);letter-spacing:-0.01em;color:#fff}
.side h1{font:500 24px/1.25 var(--serif);color:#CFE6E1;margin:36px 0 12px}
.lead{color:#B9D3CF;max-width:32ch;margin:0}
.filters{margin-top:32px;display:grid;gap:6px}
.filter{display:flex;justify-content:space-between;align-items:center;background:transparent;border:0;color:inherit;font:500 15px var(--sans);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
.filter:hover{background:rgba(255,255,255,.08)}
.filter[aria-pressed="true"]{background:var(--mint);color:var(--teal-deep)}
.filter small{font-weight:400;opacity:.85}

.main{padding:40px clamp(20px,5vw,64px);max-width:880px}
.notice{padding:12px 14px;border-radius:10px;margin-bottom:20px;font-weight:500}
.notice.ok{background:var(--ok-soft);color:#0F4A44}
.notice.err{background:var(--alert-soft);color:#7E2A21}
.empty{color:var(--muted)}

.ticket{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:6px 16px 16px 6px;padding:20px 22px;margin-bottom:36px;animation:rise .35s ease}
.ticket h2{font:600 22px var(--serif);margin:0 0 4px}
.ticket .sub{color:var(--muted);margin:0}
.facts{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:16px 0 18px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.facts .id{font:500 13px ui-monospace,Consolas,monospace;word-break:break-all}

.day{margin-bottom:36px}
.day h2{font:500 22px var(--serif);margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:start;padding:12px 0}
.who{display:flex;gap:10px;align-items:center;font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--teal-deep);display:grid;place-items:center;font-size:14px;font-weight:600}
.times{display:flex;flex-wrap:wrap;gap:8px}
.time{font:500 15px var(--sans);font-variant-numeric:tabular-nums;padding:8px 15px;border-radius:999px;border:1.5px solid var(--teal);background:transparent;color:var(--teal);cursor:pointer;transition:background .15s,color .15s}
.time:hover{background:var(--teal);color:#fff}
.time:disabled{border-color:var(--line);color:#7F9090;text-decoration:line-through;background:transparent;cursor:not-allowed}

dialog{border:0;border-radius:16px;padding:0;width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(21,41,43,.35)}
dialog::backdrop{background:rgba(21,41,43,.55)}
dialog[open]{animation:pop .2s ease}
.dlg{padding:26px}
.dlg h2{font:600 22px var(--serif);margin:0 0 4px}
.summary{color:var(--muted);margin:0 0 18px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
input{display:block;width:100%;margin-top:6px;padding:11px 12px;font:400 16px var(--sans);border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus-visible{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--mint)}
.form-error{background:var(--alert-soft);color:#7E2A21;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{font:600 15px var(--sans);padding:11px 18px;border-radius:10px;border:0;cursor:pointer}
.btn.primary{background:var(--teal);color:#fff;flex:1}
.btn.primary:hover{background:#185A54}
.btn.primary:disabled{background:#8FB1AD;cursor:wait}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--alert);border:1.5px solid #E2B8B2}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:24px 20px}
  .side h1{font-size:21px;margin-top:20px}
  .brand{font-size:26px}
  .filters{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;margin-top:20px}
  .row{grid-template-columns:1fr;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="15" fill="#CFE6E1"/><path d="M15 8v14M8 15h14" stroke="#17383A" stroke-width="3" stroke-linecap="round"/></svg>
      <span>Rohifield Family Clinic</span>
    </div>
    <h1>Choose a time that suits you</h1>
    <p class="lead">Every appointment is 30 minutes. Pick a time, add your details, and you're booked.</p>
    <nav class="filters" id="filters" aria-label="Filter by doctor"></nav>
  </aside>
  <main class="main">
    <div id="status" role="status" aria-live="polite"></div>
    <section id="ticket"></section>
    <section id="days" aria-label="Available appointments">Loading appointments...</section>
  </main>
</div>

<dialog id="dlg">
  <form class="dlg" id="bookForm" novalidate>
    <h2>Confirm your appointment</h2>
    <p class="summary" id="summary"></p>
    <div id="formError"></div>
    <label>Full name<input id="name" autocomplete="name"></label>
    <label>Email address<input id="email" type="email" autocomplete="email"></label>
    <div class="actions">
      <button type="button" class="btn quiet" id="closeBtn">Not now</button>
      <button class="btn primary" id="confirmBtn">Confirm booking</button>
    </div>
  </form>
</dialog>

<script>
const API_KEY = 'my-secret-key-123'; // must match the API_KEY on your server
const $ = id => document.getElementById(id);
let slots = [], filter = 'all', chosen = null, ticket = null;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n[k] = v;
    else n.setAttribute(k, v);
  }
  n.append(...kids);
  return n;
}

async function api(path, options = {}) {
  try {
    const res = await fetch(path, {
      ...options,
      headers: { 'X-API-Key': API_KEY, 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  } catch (e) {
    return { res: null, data: {} };
  }
}

const timeOf = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const dayOf = iso => new Date(iso).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
const dayKey = iso => { const d = new Date(iso); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1) + (/[.!?]$/.test(s) ? '' : '.');

function notice(text, kind) {
  const box = $('status');
  box.textContent = '';
  if (text) box.append(el('div', { class: 'notice ' + kind }, text));
}

function formError(text) {
  const box = $('formError');
  box.textContent = '';
  if (text) box.append(el('div', { class: 'form-error' }, text));
}

function renderFilters() {
  const nav = $('filters');
  nav.textContent = '';
  const open = list => list.filter(s => s.available).length;
  const add = (label, key, count) => nav.append(
    el('button', { class: 'filter', type: 'button', 'aria-pressed': String(filter === key), onclick: () => { filter = key; render(); } },
      el('span', {}, label), el('small', {}, count + ' open'))
  );
  add('All doctors', 'all', open(slots));
  [...new Set(slots.map(s => s.provider))].forEach(n => add(n, n, open(slots.filter(s => s.provider === n))));
}

function renderDays() {
  const box = $('days');
  box.textContent = '';
  const list = slots.filter(s => filter === 'all' || s.provider === filter);
  if (!list.length) {
    box.append(el('p', { class: 'empty' }, 'No appointments are listed right now. Check back soon.'));
    return;
  }
  const days = new Map();
  list.forEach(s => {
    const k = dayKey(s.start);
    if (!days.has(k)) days.set(k, []);
    days.get(k).push(s);
  });
  days.forEach(daySlots => {
    const section = el('section', { class: 'day' }, el('h2', {}, dayOf(daySlots[0].start)));
    const byDoc = new Map();
    daySlots.forEach(s => {
      if (!byDoc.has(s.provider)) byDoc.set(s.provider, []);
      byDoc.get(s.provider).push(s);
    });
    byDoc.forEach((items, name) => {
      const times = el('div', { class: 'times' });
      items.forEach(s => {
        const b = el('button', {
          class: 'time', type: 'button',
          'aria-label': name + ' at ' + timeOf(s.start) + (s.available ? '' : ', taken'),
          onclick: () => openDialog(s)
        }, timeOf(s.start));
        b.disabled = !s.available;
        times.append(b);
      });
      const initial = name.replace(/^Dr\.?\s*/i, '').charAt(0).toUpperCase();
      section.append(el('div', { class: 'row' },
        el('div', { class: 'who' }, el('span', { class: 'avatar', 'aria-hidden': 'true' }, initial), el('span', {}, name)),
        times));
    });
    box.append(section);
  });
}

function render() { renderFilters(); renderDays(); }

async function loadSlots(first) {
  let waking;
  if (first) waking = setTimeout(() => notice('Waking up the booking service. The first visit can take up to a minute.', 'ok'), 4000);
  const { res, data } = await api('/slots');
  clearTimeout(waking);
  if (!res || !res.ok) {
    if (first) {
      notice('We could not load the appointments. Check your connection and try again.', 'err');
      const box = $('days');
      box.textContent = '';
      box.append(el('button', { class: 'btn quiet', type: 'button', onclick: () => loadSlots(true) }, 'Try again'));
    }
    return;
  }
  if (first) notice('', 'ok');
  slots = data.slots || [];
  if (filter !== 'all' && !slots.some(s => s.provider === filter)) filter = 'all';
  render();
}

function openDialog(s) {
  chosen = s;
  $('summary').textContent = s.provider + ', ' + dayOf(s.start) + ' at ' + timeOf(s.start);
  formError('');
  $('bookForm').reset();
  $('confirmBtn').disabled = false;
  $('dlg').showModal();
  $('name').focus();
}

function renderTicket() {
  const box = $('ticket');
  box.textContent = '';
  if (!ticket) return;
  const { booking: b, slot: s } = ticket;
  const row = (k, v, cls) => [el('dt', {}, k), el('dd', { class: cls || '' }, v)];
  const dl = el('dl', { class: 'facts' },
    ...row('Doctor', s.provider),
    ...row('When', dayOf(s.start) + ' at ' + timeOf(s.start)),
    ...row('Patient', b.name + ' (' + b.email + ')'),
    ...row('Booking ID', b.id, 'id'));
  const cancel = el('button', { class: 'btn danger', type: 'button' }, 'Cancel this booking');
  cancel.onclick = async () => {
    cancel.disabled = true;
    const { res, data } = await api('/bookings/' + b.id, { method: 'DELETE' });
    if (res && res.ok) {
      ticket = null;
      renderTicket();
      notice('Your booking is cancelled and the time is open again.', 'ok');
      loadSlots();
    } else {
      cancel.disabled = false;
      notice(cap(data.error || 'We could not cancel the booking. Please try again'), 'err');
    }
  };
  box.append(el('article', { class: 'ticket' },
    el('h2', {}, 'Your appointment is confirmed'),
    el('p', { class: 'sub' }, 'Keep your booking ID for your records.'),
    dl, cancel));
}

$('bookForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('name').value, email = $('email').value;
  if (!name.trim() || !email.trim()) return formError('Enter your name and email address to continue.');
  const btn = $('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Booking...';
  const key = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random();
  const { res, data } = await api('/bookings', {
    method: 'POST',
    headers: { 'Idempotency-Key': key },
    body: JSON.stringify({ slot_id: chosen.id, name, email })
  });
  btn.disabled = false;
  btn.textContent = 'Confirm booking';
  if (!res) return formError('We could not reach the server. Check your connection and try again.');
  if (res.status === 201) {
    $('dlg').close();
    ticket = { booking: data, slot: chosen };
    notice('', 'ok');
    renderTicket();
    await loadSlots();
    $('ticket').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (res.status === 409) {
    $('dlg').close();
    notice('That time was just taken. Please choose another.', 'err');
    return loadSlots();
  }
  if (res.status === 429) {
    const wait = res.headers.get('Retry-After');
    return formError('Too many attempts for this email. Try again in ' + (wait || 'a minute') + ' seconds.');
  }
  formError(cap(data.error || 'Something went wrong. Please try again'));
};

$('closeBtn').onclick = () => $('dlg').close();
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });

loadSlots(true);
</script>
</body>
</html>
